            Location:
              type: string
              description: A presigned URL to download the deployment package
            ImageUri:
              type: string
              description: The URI of the container image
        Tags:
          type: object
          description: The function's tags
          additionalProperties:
            type: string
    ListFunctionsResponse:
      type: object
