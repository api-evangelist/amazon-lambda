apis:
- name: Amazon Lambda API
  description: >-
    Core API for managing AWS Lambda functions, event source mappings, layers,
    aliases, versions, and permissions. Enables creating and invoking serverless
    functions, configuring triggers from AWS services, and managing function
    deployment packages and runtime configurations.
